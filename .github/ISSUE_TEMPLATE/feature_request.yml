name: Feature request
description: Suggest an improvement for open-doc
title: "[Feature]: "
labels:
  - enhancement
assignees:
  - RemoteRabbit
body:
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - CLI
        - Configuration
        - Module inspection
        - Markdown rendering
        - Output writing or injection
        - Provider schema enrichment
        - Build or development tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation would this feature address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who would benefit, and how would this improve their workflow?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.

  - type: textarea
    id: examples
    attributes:
      label: Example
      description: Include example commands, configuration, input, or generated Markdown when useful.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, references, or screenshots.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for a similar request.
          required: true
